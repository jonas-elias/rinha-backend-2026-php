; Tuning para hot path CPU-bound — sem mysqli, sem PDO.
memory_limit = -1
realpath_cache_size = 4M
realpath_cache_ttl = 600
expose_php = Off
date.timezone = UTC
short_open_tag = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

; swoole.so e opcache.so são habilitados por docker-php-ext-enable; não duplicamos aqui.

; OPcache + JIT tracing — o pulo-do-gato pra extrair o máximo do PHP puro.
; Sob limite RSS de 165 MB / container, mantemos os buffers SHM enxutos:
;   index heap ≈ 90 MB + opcache 16 MB + jit 16 MB + PHP/swoole ≈ 30 MB.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 16
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 1000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1
opcache.huge_code_pages = 1
opcache.preload = /app/preload.php
opcache.preload_user = root
opcache.jit = tracing
opcache.jit_buffer_size = 16M
opcache.jit_max_root_traces = 1024
opcache.jit_max_side_traces = 8192
opcache.jit_hot_loop = 8
opcache.jit_hot_func = 8
opcache.jit_hot_return = 4
opcache.jit_hot_side_exit = 4

; Não emitimos opcode logs em prod
opcache.log_verbosity_level = 1
